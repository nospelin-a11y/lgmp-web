# Supabase pausa los proyectos gratuitos tras una semana sin actividad, y con
# el proyecto pausado los formularios de la web dejan de funcionar. Esta acción
# hace una consulta trivial cada tres días para que eso no pase.
#
# No necesita ningún secreto: la URL y la clave anon son públicas por diseño y
# se leen del propio /lgmp-datos.js, así que si cambian ahí, esto las sigue.
#
# Ojo: GitHub desactiva los workflows programados de los repositorios sin
# actividad durante 60 días. Si algún día llega el aviso por correo, basta con
# entrar y reactivarlo.

name: Ping a Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar contar_socios()
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL *= *'\([^']*\)'.*/\1/p" lgmp-datos.js | head -1)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY *= *'\([^']*\)'.*/\1/p" lgmp-datos.js | head -1)

          if [ -z "$URL" ] || [ "${URL#PEGA_AQUI}" != "$URL" ]; then
            echo "::warning::lgmp-datos.js todavía no tiene la URL de Supabase. No hay nada que despertar."
            exit 0
          fi

          codigo=$(curl -s -o /tmp/respuesta.txt -w '%{http_code}' -X POST \
            "$URL/rest/v1/rpc/contar_socios" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -d '{}')

          echo "HTTP $codigo · respuesta: $(cat /tmp/respuesta.txt)"
          if [ "$codigo" != "200" ]; then
            echo "::error::Supabase no ha respondido correctamente. Revisa el proyecto."
            exit 1
          fi
