<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · La Generación Mejor Preparada</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F4F6FA;font-family:'Nunito Sans',sans-serif;color:#1E2A4A;-webkit-font-smoothing:antialiased}
  a{color:#F0503C}
  .oculto{display:none !important}

  /* ---- Acceso ---- */
  .acceso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#1E2A4A}
  .acceso .caja{width:100%;max-width:400px;background:#ffffff;border-radius:24px;padding:40px 34px}
  .acceso img{height:46px;display:block;margin:0 auto 26px}
  .acceso h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:24px;margin:0 0 6px;text-align:center}
  .acceso p.sub{text-align:center;color:rgba(30,42,74,.7);font-size:15px;margin:0 0 26px}

  label{font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;display:block;margin-bottom:7px}
  input[type=email],input[type=password],input[type=search],input[type=text],input[type=url],
  input[type=date],input[type=number],textarea,select.campo{
    width:100%;background:#F4F6FA;border:1px solid rgba(30,42,74,.12);border-radius:12px;
    padding:13px 15px;font-family:'Nunito Sans',sans-serif;font-size:15.5px;color:#1E2A4A;outline:none}
  textarea{min-height:96px;resize:vertical}
  input:focus,textarea:focus,select.campo:focus{border-color:#F0503C;background:#ffffff}
  .campo{margin-bottom:16px}
  .ayuda{font-size:13px;color:rgba(30,42,74,.6);margin:6px 0 0}
  .check{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;margin-bottom:14px}
  .check input{width:19px;height:19px;accent-color:#F0503C;cursor:pointer}
  .check label{margin:0;font-weight:600}

  .btn{background:#F0503C;color:#ffffff;border:none;cursor:pointer;font-family:'Nunito',sans-serif;
       font-weight:800;font-size:16px;padding:14px 28px;border-radius:999px;
       box-shadow:0 8px 24px rgba(240,80,60,.35);transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.6;cursor:wait;transform:none}
  .btn.ancho{width:100%}
  .btn.gris{background:#ffffff;color:#1E2A4A;border:1px solid rgba(30,42,74,.2);box-shadow:none}
  .btn.rojo{background:#ffffff;color:#C4341F;border:1px solid rgba(196,52,31,.35);box-shadow:none}
  .aviso{background:rgba(240,80,60,.1);color:#C4341F;border-radius:12px;padding:12px 14px;
         font-size:14.5px;font-weight:600;margin-bottom:16px}

  /* ---- Cabecera ---- */
  header{background:#182548;padding:14px 0;position:sticky;top:0;z-index:40}
  header .cont{max-width:1500px;margin:0 auto;padding:0 22px;display:flex;align-items:center;
               justify-content:space-between;gap:16px;flex-wrap:wrap}
  header img{height:38px;display:block}
  header .quien{color:rgba(255,255,255,.65);font-size:13.5px;margin-left:auto;margin-right:14px}
  .salir{background:transparent;border:1px solid rgba(255,255,255,.3);color:#ffffff;cursor:pointer;
         font-family:'Nunito',sans-serif;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:999px}
  .salir:hover{background:rgba(255,255,255,.1)}

  main{max-width:1500px;margin:0 auto;padding:26px 22px 70px}

  /* ---- Resumen ---- */
  .resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
  .dato{background:#ffffff;border:1px solid rgba(30,42,74,.08);border-radius:18px;padding:20px 22px}
  .dato .n{font-family:'Nunito',sans-serif;font-weight:900;font-size:34px;line-height:1;color:#F0503C}
  .dato .t{font-size:13.5px;color:rgba(30,42,74,.7);margin-top:8px}
  .dato .pend{font-size:12.5px;font-weight:700;color:#1E2A4A;margin-top:4px}

  /* ---- Pestañas ---- */
  .grupo{margin-bottom:14px}
  .grupo .etiqueta{font-family:'Nunito',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.14em;
                   text-transform:uppercase;color:rgba(30,42,74,.45);margin-bottom:8px}
  .pestanas{display:flex;gap:8px;flex-wrap:wrap}
  .pestana{background:#ffffff;border:1px solid rgba(30,42,74,.1);cursor:pointer;
           font-family:'Nunito',sans-serif;font-weight:700;font-size:14.5px;color:#1E2A4A;
           padding:11px 18px;border-radius:999px}
  .pestana.activa{background:#1E2A4A;color:#ffffff;border-color:#1E2A4A}

  /* ---- Herramientas ---- */
  .herramientas{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .herramientas input[type=search]{max-width:340px}
  .csv,.nuevo{cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;
              padding:12px 20px;border-radius:999px}
  .csv{background:#ffffff;border:1px solid rgba(30,42,74,.18);color:#1E2A4A}
  .csv:hover{border-color:#F0503C;color:#F0503C}
  .nuevo{background:#F0503C;border:none;color:#ffffff;box-shadow:0 6px 18px rgba(240,80,60,.3)}

  /* ---- Tabla ---- */
  .marco{background:#ffffff;border:1px solid rgba(30,42,74,.08);border-radius:18px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:820px;font-size:14.5px}
  th{text-align:left;padding:14px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;
     letter-spacing:.06em;text-transform:uppercase;color:#F0503C;border-bottom:2px solid rgba(30,42,74,.1);
     white-space:nowrap;background:#ffffff}
  td{padding:13px 16px;border-bottom:1px solid rgba(30,42,74,.07);vertical-align:top;line-height:1.5}
  tr:last-child td{border-bottom:none}
  tr.fila{cursor:pointer}
  tr.fila:hover{background:#F4F6FA}
  .recorte{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .vacio{padding:44px 20px;text-align:center;color:rgba(30,42,74,.6)}
  .cargando{padding:44px;text-align:center;color:rgba(30,42,74,.6)}

  .marca{cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;
         padding:6px 13px;border-radius:999px;border:1px solid rgba(30,42,74,.2);background:#ffffff;
         color:rgba(30,42,74,.7);white-space:nowrap}
  .marca.si{background:#1E2A4A;border-color:#1E2A4A;color:#ffffff}
  select.estado{font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;padding:6px 10px;
                border-radius:999px;border:1px solid rgba(30,42,74,.2);background:#ffffff;color:#1E2A4A;cursor:pointer}
  .pastilla{display:inline-block;font-family:'Nunito',sans-serif;font-weight:700;font-size:11.5px;
            padding:4px 11px;border-radius:999px;background:#F4F6FA;color:rgba(30,42,74,.65);white-space:nowrap}
  .pastilla.viva{background:rgba(240,80,60,.12);color:#C4341F}

  /* ---- Ventana ---- */
  .fondo{position:fixed;inset:0;background:rgba(24,37,72,.55);display:flex;align-items:center;
         justify-content:center;padding:20px;z-index:60}
  .ficha{background:#ffffff;border-radius:22px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:32px}
  .ficha h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:21px;margin:0 0 20px}
  .ficha dl{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin:0}
  .ficha dt{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#F0503C;white-space:nowrap}
  .ficha dd{margin:0;font-size:14.5px;line-height:1.55;word-break:break-word}
  .acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
  .acciones .btn{font-size:15px;padding:12px 26px}

  /* ---- Editor de texto largo ---- */
  .ficha.ancha{max-width:900px}
  .editor{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .editor textarea{min-height:300px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6}
  .barra{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .barra button{cursor:pointer;background:#ffffff;border:1px solid rgba(30,42,74,.18);border-radius:8px;
                font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;padding:6px 11px;color:#1E2A4A}
  .barra button:hover{border-color:#F0503C;color:#F0503C}
  .previa{background:#ffffff;border:1px solid rgba(30,42,74,.12);border-radius:12px;padding:16px 18px;
          overflow-y:auto;max-height:420px;font-size:15px;line-height:1.65}
  .previa h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:20px;margin:18px 0 8px}
  .previa h3{font-family:'Nunito',sans-serif;font-weight:800;font-size:17px;margin:16px 0 6px}
  .previa p{margin:0 0 12px}
  .previa ul,.previa ol{margin:0 0 12px;padding-left:22px}
  .previa blockquote{margin:0 0 12px;padding-left:14px;border-left:3px solid #F0503C;color:rgba(30,42,74,.75)}
  .previa:empty::before{content:'La vista previa aparecerá aquí.';color:rgba(30,42,74,.45)}
  .enlacePagina{font-size:13.5px;margin-top:-6px;margin-bottom:16px}

  @media (max-width:820px){ .editor{grid-template-columns:1fr} .previa{max-height:220px} }
  @media (max-width:640px){
    main{padding:18px 14px 60px}
    .ficha{padding:24px 20px}
    .ficha dl{grid-template-columns:1fr;gap:2px}
    .ficha dd{margin-bottom:12px}
  }
</style>
</head>
<body>

<!-- ================= ACCESO ================= -->
<div id="acceso" class="acceso">
  <div class="caja">
    <img src="/assets/logo-light.webp" alt="La Generación Mejor Preparada">
    <h1>Panel de la Asociación</h1>
    <p class="sub">Solo para la Junta Directiva</p>
    <div id="errorAcceso" class="aviso oculto"></div>
    <form id="formAcceso">
      <div class="campo">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn ancho" id="btnEntrar">Entrar</button>
    </form>
  </div>
</div>

<!-- ================= PANEL ================= -->
<div id="app" class="oculto">
  <header>
    <div class="cont">
      <img src="/assets/logo-dark.webp" alt="LGMP">
      <span class="quien" id="quien"></span>
      <button class="salir" id="btnSalir">Salir</button>
    </div>
  </header>

  <main>
    <div class="resumen" id="resumen"></div>
    <div class="grupo">
      <div class="etiqueta">Lo que llega de la web</div>
      <div class="pestanas" id="pestEntradas"></div>
    </div>
    <div class="grupo">
      <div class="etiqueta">Contenido que podéis editar</div>
      <div class="pestanas" id="pestContenido"></div>
    </div>
    <div class="herramientas">
      <input type="search" id="buscar" placeholder="Buscar…" autocomplete="off">
      <button class="csv" id="btnCsv">Descargar CSV</button>
      <button class="nuevo oculto" id="btnNuevo">+ Añadir</button>
    </div>
    <div class="marco">
      <div class="scroll" id="contenido"><div class="cargando">Cargando…</div></div>
    </div>
  </main>
</div>

<div id="ventana"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { aHtml } from '/md.js';

const URL_SB = 'https://cegicdvznbvbemqoftod.supabase.co';
const CLAVE  = 'sb_publishable_hyev91V4OhpAo79Ox7vqBg_LU_Mfzbh';
const sb = createClient(URL_SB, CLAVE);

/* ---------------------------------------------------------------
   Lo que llega de la web: se lee y se marca, no se crea ni se borra.
   --------------------------------------------------------------- */
const ENTRADAS = [
  { id:'contactos', titulo:'Contactos', tabla:'contactos', orden:'creado_en',
    campos:[['nombre','Nombre'],['email','Email'],['telefono','Teléfono'],['mensaje','Mensaje']],
    marca:{ campo:'atendido', tipo:'bool', si:'Atendido', no:'Pendiente' },
    pendiente:r => !r.atendido },
  { id:'evento', titulo:'Inscritos al evento', tabla:'inscripciones_evento', orden:'creado_en',
    campos:[['nombre','Nombre'],['email','Email'],['telefono','Teléfono'],['perfil','Perfil']],
    marca:{ campo:'asistio', tipo:'bool', si:'Asistió', no:'—' } },
  { id:'altas', titulo:'Altas de socio', tabla:'altas_socio', orden:'creado_en',
    campos:[['nombre','Nombre'],['email','Email'],['telefono','Teléfono'],['tramo','Cuota'],['municipio','Municipio']],
    marca:{ campo:'estado', tipo:'lista', opciones:['pendiente','aceptado','rechazado'] },
    pendiente:r => r.estado === 'pendiente' },
  { id:'entidades', titulo:'Altas de entidad', tabla:'altas_entidad', orden:'creado_en',
    campos:[['entidad','Entidad'],['contacto_nombre','Contacto'],['email','Email'],['telefono','Teléfono'],['origen','Tipo']],
    marca:{ campo:'estado', tipo:'lista', opciones:['pendiente','aceptado','rechazado'] },
    pendiente:r => r.estado === 'pendiente' },
  { id:'newsletter', titulo:'Newsletter', tabla:'newsletter', orden:'creado_en',
    campos:[['nombre','Nombre'],['email','Email']] }
];

/* ---------------------------------------------------------------
   Contenido editable. `form` describe el formulario de alta/edición.
   --------------------------------------------------------------- */
const CONTENIDO = [
  { id:'socios', titulo:'Socios', tabla:'socios', orden:'orden', asc:true, editable:true,
    campos:[['nombre','Nombre'],['cargo_asociacion','Cargo'],['cargo_profesional','Puesto'],
            ['empresa','Empresa'],['publicar','En la web'],['activo','Cuenta']],
    form:[
      { c:'nombre', t:'Nombre', tipo:'text', req:true, ayuda:'Como quiere aparecer publicado.' },
      { c:'cargo_asociacion', t:'Cargo en la Asociación', tipo:'text', ayuda:'Presidente, Secretaria, Tesorero o Vocal. Vacío si es socio sin cargo.' },
      { c:'cargo_profesional', t:'Puesto profesional', tipo:'text' },
      { c:'empresa', t:'Empresa', tipo:'text' },
      { c:'linkedin', t:'LinkedIn', tipo:'url' },
      { c:'twitter', t:'Twitter / X', tipo:'url' },
      { c:'foto_url', t:'Foto', tipo:'text', ayuda:'Ruta o dirección de la imagen. Ej.: /assets/equipo/socios/nombre.webp' },
      { c:'orden', t:'Orden', tipo:'number', ayuda:'Menor número, más arriba.' },
      { c:'es_junta', t:'Es de la Junta Directiva', tipo:'bool' },
      { c:'publicar', t:'Aparece en la web', tipo:'bool', ayuda:'Solo si ha dado su consentimiento por escrito.' },
      { c:'activo', t:'Cuenta para el número de socios', tipo:'bool' }
    ] },
  { id:'eventos', titulo:'Eventos', tabla:'eventos', orden:'fecha', asc:false, editable:true,
    campos:[['fecha','Fecha'],['titulo','Título'],['lugar','Lugar'],['publicado','Publicado']],
    form:[
      { c:'titulo', t:'Título', tipo:'text', req:true },
      { c:'fecha', t:'Fecha', tipo:'date', req:true },
      { c:'hora', t:'Hora', tipo:'text', ayuda:'Texto libre. Ej.: 18:30' },
      { c:'lugar', t:'Lugar', tipo:'text' },
      { c:'descripcion', t:'Entradilla', tipo:'textarea', ayuda:'Una o dos frases. Es lo que se ve en el listado de Actividades.' },
      { c:'cuerpo', t:'Texto del evento', tipo:'markdown', ayuda:'El contenido de su página. Puedes dejarlo vacío si no hace falta.' },
      { c:'url_inscripcion', t:'Enlace de inscripción', tipo:'text', ayuda:'Ej.: /presentacion/' },
      { c:'slug', t:'Dirección', tipo:'text', ayuda:'Se rellena sola con el título. /eventos/lo-que-pongas-aqui/' },
      { c:'publicado', t:'Publicado', tipo:'bool' }
    ] },
  { id:'noticias', titulo:'Noticias', tabla:'noticias', orden:'fecha', asc:false, editable:true,
    campos:[['fecha','Fecha'],['categoria','Categoría'],['titulo','Título'],['publicado','Publicado']],
    form:[
      { c:'titulo', t:'Título', tipo:'text', req:true },
      { c:'fecha', t:'Fecha', tipo:'date', req:true },
      { c:'categoria', t:'Categoría', tipo:'text', ayuda:'Ej.: Prensa, Actividad, Comunidad' },
      { c:'resumen', t:'Entradilla', tipo:'textarea', ayuda:'Una o dos frases. Es lo que se ve en el listado.' },
      { c:'cuerpo', t:'Texto de la noticia', tipo:'markdown', ayuda:'El contenido de su página.' },
      { c:'autor', t:'Firma', tipo:'text' },
      { c:'url', t:'Enlace externo', tipo:'url', ayuda:'Solo si la noticia está publicada en otro sitio.' },
      { c:'imagen_url', t:'Imagen', tipo:'text' },
      { c:'slug', t:'Dirección', tipo:'text', ayuda:'Se rellena sola con el título. /noticias/lo-que-pongas-aqui/' },
      { c:'publicado', t:'Publicado', tipo:'bool' }
    ] },
  { id:'redes', titulo:'Números de redes', tabla:'redes_metricas', orden:'red', asc:true,
    editable:true, clave:'red', crear:false, borrar:false,
    campos:[['red','Red'],['seguidores','Seguidores'],['impresiones','Impresiones'],['actualizado_en','Actualizado']],
    form:[
      { c:'seguidores', t:'Seguidores', tipo:'number' },
      { c:'impresiones', t:'Impresiones o visualizaciones', tipo:'number' }
    ] }
];

const TODAS = ENTRADAS.concat(CONTENIDO);
const $ = s => document.querySelector(s);
let activa = ENTRADAS[0];
let filas = [];
let filtro = '';

const clave = s => s.clave || 'id';
const RUTA_PUBLICA = { noticias:'/noticias/', eventos:'/eventos/' };

/* ---------------- Acceso ---------------- */

function errorAcceso(msg){
  const e = $('#errorAcceso');
  e.textContent = msg;
  e.classList.toggle('oculto', !msg);
}

$('#formAcceso').addEventListener('submit', async ev => {
  ev.preventDefault();
  errorAcceso('');
  const btn = $('#btnEntrar');
  btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#clave').value });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) {
    errorAcceso(error.message === 'Invalid login credentials'
      ? 'Correo o contraseña incorrectos.' : error.message);
    return;
  }
  arrancar();
});

$('#btnSalir').addEventListener('click', async () => {
  await sb.auth.signOut(); location.reload();
});

async function arrancar(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { $('#acceso').classList.remove('oculto'); return; }

  // Estar autenticado no basta: hay que figurar en la tabla `junta`.
  const { data: esJunta } = await sb.rpc('es_junta');
  if (!esJunta) {
    await sb.auth.signOut();
    $('#acceso').classList.remove('oculto');
    errorAcceso('Esta cuenta no tiene acceso al panel. Habla con el presidente.');
    return;
  }

  $('#acceso').classList.add('oculto');
  $('#app').classList.remove('oculto');
  $('#quien').textContent = session.user.email;
  pintarPestanas();
  await cargarResumen();
  await cargarSeccion();
}

/* ---------------- Navegación ---------------- */

function pintarPestanas(){
  const html = lista => lista.map(s =>
    `<button class="pestana ${s.id===activa.id?'activa':''}" data-id="${s.id}">${s.titulo}</button>`).join('');
  $('#pestEntradas').innerHTML  = html(ENTRADAS);
  $('#pestContenido').innerHTML = html(CONTENIDO);
  document.querySelectorAll('.pestana').forEach(b => b.addEventListener('click', () => {
    activa = TODAS.find(s => s.id === b.dataset.id);
    filtro = ''; $('#buscar').value = '';
    pintarPestanas(); cargarSeccion();
  }));
}

async function cargarResumen(){
  const cajas = await Promise.all(ENTRADAS.map(async s => {
    const { data, error } = await sb.from(s.tabla).select('*');
    if (error) return { s, total:'–', pend:0 };
    return { s, total:data.length, pend: s.pendiente ? data.filter(s.pendiente).length : 0 };
  }));
  const { data: nSocios } = await sb.rpc('contar_socios');
  $('#resumen').innerHTML = cajas.map(c => `
    <div class="dato"><div class="n">${c.total}</div><div class="t">${c.s.titulo}</div>
    ${c.pend ? `<div class="pend">${c.pend} sin revisar</div>` : ''}</div>`).join('')
    + `<div class="dato"><div class="n">${nSocios ?? '–'}</div><div class="t">Socios activos</div>
       <div class="pend">es el número que sale en la web</div></div>`;
}

async function cargarSeccion(){
  $('#contenido').innerHTML = '<div class="cargando">Cargando…</div>';
  $('#btnNuevo').classList.toggle('oculto', !(activa.editable && activa.crear !== false));
  const { data, error } = await sb.from(activa.tabla).select('*')
    .order(activa.orden, { ascending: activa.asc === true });
  if (error) {
    $('#contenido').innerHTML = `<div class="vacio">No se han podido cargar los datos.<br><small>${escapar(error.message)}</small></div>`;
    return;
  }
  filas = data;
  pintarTabla();
}

/* ---------------- Utilidades ---------------- */

const escapar = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fechaHora = v => v ? new Date(v).toLocaleDateString('es-ES',
  { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
const soloFecha = v => v ? new Date(v + 'T00:00:00').toLocaleDateString('es-ES',
  { day:'2-digit', month:'2-digit', year:'numeric' }) : '';

function celda(r, c){
  const v = r[c];
  if (typeof v === 'boolean')
    return `<span class="pastilla ${v?'viva':''}">${v ? 'Sí' : 'No'}</span>`;
  if (c === 'fecha') return soloFecha(v);
  if (c.endsWith('_en')) return fechaHora(v);
  if (typeof v === 'number') return v.toLocaleString('es-ES');
  return `<span class="recorte">${escapar(v)}</span>`;
}

function visibles(){
  if (!filtro) return filas;
  const q = filtro.toLowerCase();
  return filas.filter(r => Object.values(r).some(v => String(v ?? '').toLowerCase().includes(q)));
}

/* ---------------- Tabla ---------------- */

function pintarTabla(){
  const s = activa, datos = visibles();
  if (!datos.length) {
    $('#contenido').innerHTML = `<div class="vacio">${filtro ? 'Nada coincide con la búsqueda.' : 'Todavía no hay nada aquí.'}</div>`;
    return;
  }
  const primeraFecha = s.editable ? [] : ['<th>Fecha</th>'];
  const cabecera = primeraFecha.concat(s.campos.map(c => `<th>${c[1]}</th>`))
                               .concat(s.marca ? ['<th></th>'] : []).join('');

  const cuerpo = datos.map(r => {
    const cs = (s.editable ? [] : [`<td>${fechaHora(r.creado_en)}</td>`])
      .concat(s.campos.map(c => `<td>${celda(r, c[0])}</td>`));
    if (s.marca) {
      const v = r[s.marca.campo];
      cs.push(s.marca.tipo === 'bool'
        ? `<td><button class="marca ${v?'si':''}" data-k="${escapar(r[clave(s)])}" data-campo="${s.marca.campo}" data-valor="${!v}">${v?s.marca.si:s.marca.no}</button></td>`
        : `<td><select class="estado" data-k="${escapar(r[clave(s)])}" data-campo="${s.marca.campo}">`
          + s.marca.opciones.map(o => `<option value="${o}" ${v===o?'selected':''}>${o}</option>`).join('')
          + `</select></td>`);
    }
    return `<tr class="fila" data-k="${escapar(r[clave(s)])}">${cs.join('')}</tr>`;
  }).join('');

  $('#contenido').innerHTML = `<table><thead><tr>${cabecera}</tr></thead><tbody>${cuerpo}</tbody></table>`;

  $('#contenido').querySelectorAll('tr.fila').forEach(tr => tr.addEventListener('click', ev => {
    if (ev.target.closest('button, select')) return;
    const r = filas.find(f => String(f[clave(s)]) === tr.dataset.k);
    s.editable ? editar(r) : verFicha(r);
  }));
  $('#contenido').querySelectorAll('.marca').forEach(b =>
    b.addEventListener('click', () => guardarCampo(b.dataset.k, b.dataset.campo, b.dataset.valor === 'true')));
  $('#contenido').querySelectorAll('.estado').forEach(sel =>
    sel.addEventListener('change', () => guardarCampo(sel.dataset.k, sel.dataset.campo, sel.value)));
}

async function guardarCampo(k, campo, valor){
  const { error } = await sb.from(activa.tabla).update({ [campo]: valor }).eq(clave(activa), k);
  if (error) { alert('No se ha podido guardar: ' + error.message); return; }
  const f = filas.find(x => String(x[clave(activa)]) === String(k));
  if (f) f[campo] = valor;
  pintarTabla(); cargarResumen();
}

/* ---------------- Ficha de solo lectura ---------------- */

const ETIQUETAS = {
  creado_en:'Recibido', nombre:'Nombre', apellido:'Apellido', email:'Email', telefono:'Teléfono',
  mensaje:'Mensaje', municipio:'Municipio', tramo:'Cuota', situacion:'Situación',
  sector:'Estudios o sector', linkedin:'LinkedIn', como_conocio:'Cómo nos conoció',
  expectativas:'Qué espera', estado:'Estado', acepta_comunicaciones:'Acepta comunicaciones',
  atendido:'Atendido', entidad:'Entidad', cif:'CIF', web:'Web', contacto_nombre:'Persona de contacto',
  contacto_cargo:'Cargo', colaboracion:'Colaboración', origen:'Tipo de alta', evento:'Evento',
  perfil:'Perfil', anio_graduacion:'Año de graduación', comentario:'Comentario', asistio:'Asistió',
  notas_internas:'Notas internas', baja_en:'Baja'
};

function abrir(html, ancha){
  $('#ventana').innerHTML = `<div class="fondo"><div class="ficha${ancha ? ' ancha' : ''}">${html}</div></div>`;
  $('#ventana .fondo').addEventListener('click', e => {
    if (e.target.classList.contains('fondo')) cerrar();
  });
}
const cerrar = () => { $('#ventana').innerHTML = ''; };

function verFicha(r){
  if (!r) return;
  const cuerpo = Object.entries(r)
    .filter(([k,v]) => k !== 'id' && v !== null && v !== '' && !(Array.isArray(v) && !v.length))
    .map(([k,v]) => {
      let t = Array.isArray(v) ? v.join(', ')
            : typeof v === 'boolean' ? (v ? 'Sí' : 'No')
            : k.endsWith('_en') ? fechaHora(v) : String(v);
      if (k === 'email') t = `<a href="mailto:${escapar(v)}">${escapar(v)}</a>`;
      else if (k === 'telefono') t = `<a href="tel:${escapar(v)}">${escapar(v)}</a>`;
      else if (k === 'linkedin' || k === 'web') t = `<a href="${escapar(v)}" target="_blank" rel="noopener">${escapar(v)}</a>`;
      else t = escapar(t);
      return `<dt>${ETIQUETAS[k] || k}</dt><dd>${t}</dd>`;
    }).join('');
  abrir(`<h2>${escapar(r.nombre || r.entidad || 'Detalle')}</h2><dl>${cuerpo}</dl>
         <div class="acciones"><button class="btn" id="vCerrar">Cerrar</button></div>`);
  $('#vCerrar').addEventListener('click', cerrar);
}

/* ---------------- Alta y edición ---------------- */

$('#btnNuevo').addEventListener('click', () => editar(null));

function editar(fila){
  const s = activa;
  if (!s.editable) return;
  const nuevo = !fila;

  const campos = s.form.map(f => {
    const v = fila ? fila[f.c] : (f.tipo === 'bool' ? false : '');
    const ayuda = f.ayuda ? `<p class="ayuda">${f.ayuda}</p>` : '';
    if (f.tipo === 'bool')
      return `<div class="check"><input type="checkbox" id="f_${f.c}" ${v?'checked':''}>
              <label for="f_${f.c}">${f.t}</label></div>${ayuda}`;
    if (f.tipo === 'markdown')
      return `<div class="campo"><label for="f_${f.c}">${f.t}</label>${ayuda}
              <div class="barra" data-para="f_${f.c}">
                <button type="button" data-fmt="**">Negrita</button>
                <button type="button" data-fmt="*">Cursiva</button>
                <button type="button" data-fmt="## ">Título</button>
                <button type="button" data-fmt="### ">Subtítulo</button>
                <button type="button" data-fmt="- ">Lista</button>
                <button type="button" data-fmt="&gt; ">Cita</button>
                <button type="button" data-fmt="enlace">Enlace</button>
              </div>
              <div class="editor">
                <textarea id="f_${f.c}" placeholder="Escribe aquí el texto…">${escapar(v)}</textarea>
                <div class="previa" id="p_${f.c}"></div>
              </div></div>`;
    if (f.tipo === 'textarea')
      return `<div class="campo"><label for="f_${f.c}">${f.t}</label>
              <textarea id="f_${f.c}">${escapar(v)}</textarea>${ayuda}</div>`;
    return `<div class="campo"><label for="f_${f.c}">${f.t}${f.req?' *':''}</label>
            <input type="${f.tipo}" id="f_${f.c}" value="${escapar(v)}">${ayuda}</div>`;
  }).join('');

  const titulo = nuevo ? 'Añadir en ' + s.titulo.toLowerCase()
                       : escapar(fila.nombre || fila.titulo || fila.red || 'Editar');
  const borrar = (!nuevo && s.borrar !== false)
    ? '<button class="btn rojo" id="vBorrar">Borrar</button>' : '';

  const ruta = RUTA_PUBLICA[s.id];
  const enlace = (!nuevo && ruta && fila.slug && fila.publicado)
    ? `<p class="enlacePagina"><a href="${ruta}${escapar(fila.slug)}/" target="_blank" rel="noopener">Ver la página publicada ↗</a></p>`
    : (!nuevo && ruta && fila.slug
        ? `<p class="enlacePagina">Se publicará en <code>${ruta}${escapar(fila.slug)}/</code></p>` : '');

  abrir(`<h2>${titulo}</h2>${enlace}<div id="vError" class="aviso oculto"></div>${campos}
         <div class="acciones"><button class="btn" id="vGuardar">Guardar</button>
         <button class="btn gris" id="vCancelar">Cancelar</button>${borrar}</div>`,
        s.form.some(f => f.tipo === 'markdown'));

  // Vista previa y botones de formato
  s.form.filter(f => f.tipo === 'markdown').forEach(f => {
    const ta = document.getElementById('f_' + f.c);
    const pv = document.getElementById('p_' + f.c);
    const pintar = () => { pv.innerHTML = aHtml(ta.value); };
    ta.addEventListener('input', pintar);
    pintar();
    document.querySelector(`.barra[data-para="f_${f.c}"]`).addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return;
      const fmt = b.dataset.fmt;
      const ini = ta.selectionStart, fin = ta.selectionEnd;
      const sel = ta.value.slice(ini, fin) || 'texto';
      let texto;
      if (fmt === 'enlace')            texto = `[${sel}](https://)`;
      else if (fmt.endsWith(' '))      texto = fmt + sel;          // encabezados, listas, citas
      else                             texto = fmt + sel + fmt;    // negrita, cursiva
      ta.setRangeText(texto, ini, fin, 'end');
      ta.focus(); pintar();
    });
  });

  $('#vCancelar').addEventListener('click', cerrar);
  if (borrar) $('#vBorrar').addEventListener('click', async () => {
    if (!confirm('¿Seguro que quieres borrarlo? No se puede deshacer.')) return;
    const { error } = await sb.from(s.tabla).delete().eq(clave(s), fila[clave(s)]);
    if (error) { alert('No se ha podido borrar: ' + error.message); return; }
    cerrar(); cargarSeccion(); cargarResumen();
  });

  $('#vGuardar').addEventListener('click', async () => {
    const datos = {};
    for (const f of s.form) {
      const el = document.getElementById('f_' + f.c);
      let v = f.tipo === 'bool' ? el.checked : el.value.trim();
      if (f.req && (v === '' || v === null)) {
        const e = $('#vError'); e.textContent = 'Falta rellenar: ' + f.t; e.classList.remove('oculto');
        el.focus(); return;
      }
      if (f.tipo === 'number') v = v === '' ? null : Number(v);
      else if (f.tipo !== 'bool' && v === '') v = null;
      datos[f.c] = v;
    }
    const btn = $('#vGuardar'); btn.disabled = true; btn.textContent = 'Guardando…';
    const q = nuevo ? sb.from(s.tabla).insert(datos)
                    : sb.from(s.tabla).update(datos).eq(clave(s), fila[clave(s)]);
    const { error } = await q;
    btn.disabled = false; btn.textContent = 'Guardar';
    if (error) {
      const e = $('#vError'); e.textContent = 'No se ha podido guardar: ' + error.message;
      e.classList.remove('oculto'); return;
    }
    cerrar(); cargarSeccion(); cargarResumen();
  });
}

/* ---------------- CSV ---------------- */

$('#btnCsv').addEventListener('click', () => {
  const datos = visibles();
  if (!datos.length) return;
  const cols = Object.keys(datos[0]);
  const c = v => {
    const t = Array.isArray(v) ? v.join(' | ') : String(v ?? '');
    return /[";\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
  };
  // Punto y coma y BOM: así Excel en español lo abre de un doble clic.
  const csv = '﻿' + [cols.join(';')]
    .concat(datos.map(r => cols.map(x => c(r[x])).join(';'))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
  a.download = `lgmp-${activa.id}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
});

$('#buscar').addEventListener('input', e => { filtro = e.target.value.trim(); pintarTabla(); });

arrancar();
</script>
