<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Muy pronto…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;background:#1E2A4A;font-family:'Nunito Sans',sans-serif;color:#ffffff;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
  @keyframes lgmpHeroUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
  @keyframes lgmpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .blob{position:fixed;border-radius:50%;pointer-events:none}
  .blob-1{top:-180px;right:-160px;width:520px;height:520px;background:radial-gradient(circle,rgba(240,80,60,.22),rgba(240,80,60,0) 65%);animation:lgmpFloat 9s ease-in-out infinite}
  .blob-2{bottom:-220px;left:-140px;width:460px;height:460px;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,0) 65%);animation:lgmpFloat 11s ease-in-out infinite}
  .wrap{position:relative;max-width:860px;margin:0 auto;padding:64px 28px;text-align:center}
  h1{animation:lgmpHeroUp .9s .1s cubic-bezier(.22,1,.36,1) both;font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(30px,5.4vw,54px);line-height:1.14;margin:0;color:#ffffff}
  h1 .destacado{color:#F0503C}
  .sub{animation:lgmpHeroUp 1s .22s cubic-bezier(.22,1,.36,1) both;font-size:clamp(17px,2vw,22px);line-height:1.6;color:rgba(255,255,255,.75);margin:22px 0 0}
  .contador{animation:lgmpHeroUp 1s .34s cubic-bezier(.22,1,.36,1) both;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:52px 0 0}
  .caja{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px 10px;min-width:108px;transition:transform .25s,background .25s}
  .caja:hover{transform:translateY(-6px);background:rgba(255,255,255,.10)}
  .caja .num{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(34px,5vw,48px);line-height:1;color:#F0503C;font-variant-numeric:tabular-nums}
  .caja .lbl{font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:10px}
  .aviso{animation:lgmpHeroUp 1s .46s cubic-bezier(.22,1,.36,1) both;margin:56px 0 0}
  .aviso p{font-size:16.5px;line-height:1.6;color:rgba(255,255,255,.75);margin:0 0 22px}
  .ml-onclick-form{cursor:pointer;border:none;background:#F0503C;color:#ffffff;font-family:'Nunito',sans-serif;font-weight:800;font-size:17px;padding:16px 34px;border-radius:999px;box-shadow:0 8px 24px rgba(240,80,60,.4);transition:transform .2s,box-shadow .2s}
  .ml-onclick-form:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(240,80,60,.5)}
  .pista{animation:lgmpHeroUp 1s .58s cubic-bezier(.22,1,.36,1) both;margin:64px 0 0;font-size:13.5px;color:rgba(255,255,255,.35)}
  @media (prefers-reduced-motion: reduce){
    h1,.sub,.contador,.aviso,.pista{animation:none}
    .blob-1,.blob-2{animation:none}
  }
</style>
</head>
<body>
<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<main class="wrap">
  <h1>No podemos decirte qué es <span class="destacado">(todavía)</span>.<br>Pero hacía mucha falta algo así.</h1>
  <p class="sub">Algo está a punto de empezar en la Región de Murcia.</p>

  <div class="contador" id="contador" role="timer" aria-label="Cuenta atrás">
    <div class="caja"><div class="num" id="cd-dias">--</div><div class="lbl">Días</div></div>
    <div class="caja"><div class="num" id="cd-horas">--</div><div class="lbl">Horas</div></div>
    <div class="caja"><div class="num" id="cd-min">--</div><div class="lbl">Minutos</div></div>
    <div class="caja"><div class="num" id="cd-seg">--</div><div class="lbl">Segundos</div></div>
  </div>

  <div class="aviso">
    <p>Déjanos tu email y serás de los primeros en descubrirlo.</p>
    <button class="ml-onclick-form" id="btn-email" type="button">Quiero enterarme antes que nadie</button>
  </div>

  <p class="pista">© 2026 · Muy pronto en lageneracionmejorpreparada.com</p>
</main>

<script>
  (function(){
    // Lanzamiento: 1 de septiembre de 2026, 00:00 hora peninsular (CEST, UTC+2)
    var objetivo = new Date('2026-09-01T00:00:00+02:00').getTime();
    var elDias = document.getElementById('cd-dias'),
        elHoras = document.getElementById('cd-horas'),
        elMin = document.getElementById('cd-min'),
        elSeg = document.getElementById('cd-seg');
    function pad(n){ return n < 10 ? '0' + n : '' + n; }
    function tick(){
      var resta = objetivo - Date.now();
      if (resta <= 0) {
        elDias.textContent = '00'; elHoras.textContent = '00';
        elMin.textContent = '00'; elSeg.textContent = '00';
        clearInterval(intervalo);
        return;
      }
      elDias.textContent = pad(Math.floor(resta / 86400000));
      elHoras.textContent = pad(Math.floor(resta % 86400000 / 3600000));
      elMin.textContent = pad(Math.floor(resta % 3600000 / 60000));
      elSeg.textContent = pad(Math.floor(resta % 60000 / 1000));
    }
    tick();
    var intervalo = setInterval(tick, 1000);
  })();

  // MailerLite se carga SOLO al pulsar el botón, para que el popup no salte al entrar
  document.getElementById('btn-email').addEventListener('click', function(){
    if (window.ml) { ml('show', 'tVANqC', true); return; }
    (function(w,d,e,u,f,l,n){w[f]=w[f]||function(){(w[f].q=w[f].q||[])
    .push(arguments);},l=d.createElement(e),l.async=1,l.src=u,
    n=d.getElementsByTagName(e)[0],n.parentNode.insertBefore(l,n);})
    (window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
    ml('account', '1740625');
    ml('show', 'tVANqC', true);
  });
</script>
</body>
</html>
